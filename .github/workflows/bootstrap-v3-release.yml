name: materialize-v3-release

on:
  push:
    branches: [refactor/v3-release]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/v3-release
          fetch-depth: 0
      - name: Extract audited v3 tree
        run: |
          cat .bootstrap/final.a .bootstrap/final.b | base64 -d | tar -xz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-v3.yml
      - name: Commit final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: rebuild Chrome Network Logger v3"
          git push origin HEAD:refactor/v3-release
